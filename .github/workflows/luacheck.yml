name: Lua lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  luacheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua 5.1 and Luacheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1 luarocks
          sudo luarocks --lua-version=5.1 install luacheck
          luacheck --version

      - name: Lint repository Lua sources
        run: |
          git ls-files -z '*.lua' ':(exclude)working_villagers/modutil/**' \
            | xargs -0 --no-run-if-empty luacheck --config .luacheckrc
